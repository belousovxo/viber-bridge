# A single Viber Desktop session for manual checks (screen in the browser: http://localhost:6080),
# and the build of the `viber-session:latest` image that the manager runs one-per-number.
#   docker compose build        # builds + tags viber-session:latest
services:
  viber-session:
    build: ./session
    image: viber-session:latest
    platform: linux/amd64
    shm_size: 1gb
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - viber-profile:/home/viber
    restart: unless-stopped

volumes:
  viber-profile:
