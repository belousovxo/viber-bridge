[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
priority=20
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -quiet -rfbport 5900 -localhost
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:viber]
command=/usr/local/bin/start-viber.sh
priority=50
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; reads new messages from viber.db and prints normalized JSON events to the log
[program:reader]
command=python3 -u /usr/local/bin/reader.py
priority=60
autorestart=true
startretries=9999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
