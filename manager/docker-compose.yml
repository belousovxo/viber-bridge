# Viber Session Manager. Build context is the repo root so it can COPY both bridge/ and manager/.
# The manager drives sibling Viber containers through the mounted docker socket (rootless: set
# DOCKER_SOCK to your rootless socket, e.g. /run/user/1000/docker.sock). The session image
# (viber-session:latest, built by the repo-root compose) must exist on the same docker host.
services:
  manager:
    build:
      context: ..
      dockerfile: manager/Dockerfile
    image: viber-manager:latest
    environment:
      - MANAGER_API_KEY=${MANAGER_API_KEY:?set MANAGER_API_KEY (same value as Chatwoot VIBER_MANAGER_API_KEY)}
      - VIBER_SESSION_IMAGE=${VIBER_SESSION_IMAGE:-viber-session:latest}
      - SESSION_MEMORY=${SESSION_MEMORY:-1g}
    ports:
      - "${MANAGER_PORT:-8800}:8800"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - manager-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  manager-data:
